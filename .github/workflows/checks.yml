name: Project checks
on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main, 'task/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned tools
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Format, lint, test, build, and verify contracts
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Verify model source and import archive
        shell: pwsh
        run: |
          python scripts/models/validate_catalog.py --expected-owner 583716264 --runtime-manifest art/catalog/runtime-artifacts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/models/test_catalog_revisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/models/test_hub_reveal.py --luau .tools/luau.exe
